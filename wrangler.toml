name = "schedula-landing-page"
main = "worker.js"
compatibility_date = "2025-01-01"

# Serve the built site from ./dist. The Worker runs for paths that do not match
# a static asset, which includes the `/ph/*` PostHog proxy route.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
